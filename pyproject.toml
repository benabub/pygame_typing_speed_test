[project]
name = "pygame-typing-speed-test"
version = "0.1.0"
description = "Test how fast you'll type 2000 symbols of text"
authors = [{ name = "Benedict Abub", email = "fkhurkhd2123dfs@tutamail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pygame>=2.6.1,<3"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
